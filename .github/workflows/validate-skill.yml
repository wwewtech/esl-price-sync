name: Validate Skill

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate SKILL.md Frontmatter & Symmetry
        run: |
          python -c "
          import re, hashlib, sys

          with open('SKILL.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # 1. Frontmatter check
          assert content.startswith('---'), 'SKILL.md must start with YAML frontmatter'
          match = re.match(r'^---\s*\n(.*?)\n---', content, re.DOTALL)
          assert match, 'Failed to parse YAML frontmatter'
          fm = match.group(1)

          # 2. Required fields
          assert re.search(r'^name:\s*\S+', fm, re.M), 'Missing name in frontmatter'
          assert re.search(r'^description:\s*\S+', fm, re.M), 'Missing description in frontmatter'

          # 3. Symmetry check
          h1 = hashlib.sha256(open('SKILL.md', 'rb').read()).hexdigest()
          h2 = hashlib.sha256(open('skills/esl-price-sync/SKILL.md', 'rb').read()).hexdigest()
          assert h1 == h2, f'Symmetry check failed! Root hash {h1} != skills hash {h2}'

          print('✓ YAML Frontmatter is valid!')
          print('✓ SHA256 symmetry check passed!')
          print('✓ SKILL.md passed all validation checks!')
          "

      - name: Run evals (schema + case integrity)
        run: |
          python -c "
          import json

          with open('evals/evals.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          evals = data.get('evals')
          assert isinstance(evals, list) and len(evals) >= 3, 'evals must be a list with >= 3 cases'

          seen_ids, seen_names = set(), set()
          for i, e in enumerate(evals):
              assert isinstance(e, dict), 'eval case must be an object'
              for field in ('id', 'name', 'prompt', 'expected_output'):
                  assert field in e and str(e[field]).strip(), 'eval case missing/empty field'
              assert len(str(e['prompt']).strip()) >= 20, 'eval prompt too short to be a real case'
              assert len(str(e['expected_output']).strip()) >= 20, 'eval expected_output too short to be real'
              assert e['id'] not in seen_ids, 'duplicate eval id'
              assert e['name'] not in seen_names, 'duplicate eval name'
              seen_ids.add(e['id'])
              seen_names.add(e['name'])

          print('evals.json: all cases passed schema + integrity checks!')
          "
