<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      .title { font-weight: 700; font-size: 28px; letter-spacing: -0.03em; fill: #ededed; }
      .sub { font-size: 14px; fill: #888888; }
      .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      .code { font-size: 13px; line-height: 1.6; }
      .red { fill: #f87171; }
      .green { fill: #34d399; }
      .blue { fill: #60a5fa; }
      .dim { fill: #52525b; }
      .text-light { fill: #e4e4e7; }
      .amber { fill: #fbbf24; }
    </style>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="480" fill="#000000"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="440" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>

  <!-- Header Bar -->
  <line x1="20" y1="76" x2="1180" y2="76" stroke="#27272a" stroke-width="1"/>

  <!-- Left Header: Project Identity -->
  <g transform="translate(44, 48)">
    <rect x="0" y="-14" width="22" height="22" rx="4" fill="#3b82f6"/>
    <rect x="5" y="-9" width="12" height="12" rx="2" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
    <text x="32" y="3" class="mono text-light" font-size="14" font-weight="600">esl-price-sync</text>
    <text x="160" y="3" class="mono dim" font-size="14">/ ZKONG · SES-imagotag · Pricer</text>
  </g>

  <!-- Right Header: Status Telemetry -->
  <g transform="translate(1156, 48)">
    <text x="0" y="2" text-anchor="end" class="mono label dim">PIPELINE AUDIT: <tspan fill="#34d399">ACTIVE (14,188/14,200 IN SYNC · 99.9%)</tspan></text>
  </g>

  <!-- Split View Dividers -->
  <line x1="600" y1="76" x2="600" y2="416" stroke="#27272a" stroke-width="1"/>
  <line x1="20" y1="416" x2="1180" y2="416" stroke="#27272a" stroke-width="1"/>

  <!-- LEFT PANE: Naive Full Push (Rejected) -->
  <g transform="translate(44, 108)">
    <text x="0" y="0" class="mono label red">NAIVE APPROACH: SCHEDULED FULL-CATALOG FLOOD (REJECTED)</text>
    
    <g transform="translate(0, 32)" class="mono code">
      <text y="0" class="dim">01 <tspan class="red"># Blast 50,000 SKUs every midnight</tspan></text>
      <text y="24" class="dim">02 <tspan class="red">for item in database.get_all_products():</tspan></text>
      <text y="48" class="dim">03 <tspan class="red">    esl_api.post("/tags/update", item)  # RF Channel jam</tspan></text>
      <text y="72" class="dim">04 <tspan class="dim"># 200 OK from REST API != Physical Tag updated:</tspan></text>
      <text y="96" class="dim">05 <tspan class="red">print("All updated!")  # Blind to dropped RF packets</tspan></text>
      <text y="120" class="dim">06 <tspan class="red"># Battery life destroyed in 8 months (exceeds 3/day)</tspan></text>
      <text y="144" class="dim">07 <tspan class="red"># Ghost pricing: POS reads $4.99, shelf reads $3.99</tspan></text>
      <text y="168" class="dim">08 <tspan class="red"># No rollback: promo price stuck on shelf after sale</tspan></text>
    </g>

    <g transform="translate(0, 240)">
      <rect width="510" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <text x="14" y="25" class="mono red" font-size="12">&#x2717; Battery exhaustion | RF collision jam | Ghost pricing blind</text>
    </g>
  </g>

  <!-- RIGHT PANE: Production Idempotent Delta Sync (Verified) -->
  <g transform="translate(640, 108)">
    <text x="0" y="0" class="mono label green">PRODUCTION: SHA256 DELTA WATERMARK &amp; GATEWAY RATE-LIMIT</text>
    
    <g transform="translate(0, 32)" class="mono code">
      <text y="0" class="dim">01 <tspan class="blue">for</tspan> item <tspan class="blue">in</tspan> incoming_catalog_stream:</text>
      <text y="24" class="dim">02     hash_val = sha256_row_watermark(item)</text>
      <text y="48" class="dim">03     <tspan class="blue">if</tspan> hash_val != last_pushed_hashes.get(item.sku):</text>
      <text y="72" class="dim">04         <tspan class="green">queue_rate_limited_rf(item, max_per_min=150)</tspan></text>
      <text y="96" class="dim">05 <tspan class="dim"># Verify 5-layer ACK status:</tspan></text>
      <text y="120" class="dim">06 <tspan class="green">assert tag_ack.status == "PHYSICAL_DISPLAY_CONFIRMED"</tspan></text>
      <text y="144" class="dim">07 battery_model_check(daily_refreshes &lt;= 3, target_years=5.5)</text>
      <text y="168" class="dim">08 <tspan class="amber">cache_rollback_state(item.sku, item.previous_price)</tspan></text>
    </g>

    <g transform="translate(0, 240)">
      <rect width="510" height="42" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="14" y="25" class="mono green" font-size="12">&#x2713; Delta watermark | 5+ yr coin cell lifespan | Zero ghost pricing</text>
    </g>
  </g>

  <!-- Footer Telemetry -->
  <g transform="translate(44, 442)">
    <text class="mono dim" font-size="12">STANDARDS: <tspan class="text-light">Sub-GHz / 2.4GHz RF Gateway Integration</tspan></text>
    <text x="440" class="mono dim" font-size="12">BATTERY: <tspan class="green">5.5+ YEARS (CR2450 COIN CELL)</tspan></text>
    <text x="800" class="mono dim" font-size="12">THROUGHPUT: <tspan class="text-light">&le; 150 TAGS/MIN/AP</tspan></text>
    <text x="1112" text-anchor="end" class="mono green" font-size="12">&#x25CF; RECONCILED</text>
  </g>
</svg>
